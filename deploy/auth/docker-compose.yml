# Pocket ID + oauth2-proxy gate for myalabor.ch
# Deploy on Pi under /mnt/mmcblk0p2/auth/
#
#   cp .env.example .env   # fill secrets
#   docker compose up -d
#
# Cloudflare Tunnel: docs/ops/cloudflare-tunnel.md

services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: ${POCKET_ID_APP_URL:-https://auth.myalabor.ch}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:1411:1411"
    volumes:
      - ./pocket-id-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 15s

  # One proxy instance per public hostname (household scale).
  # Upstreams use host-gateway so loopback services on the Pi are reachable.
  oauth2-proxy-dashboard:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    restart: unless-stopped
    depends_on:
      - pocket-id
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: ${UPSTREAM_DASHBOARD:-http://host.docker.internal:8790}
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER:-https://auth.myalabor.ch}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OIDC_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 2160h
      OAUTH2_PROXY_COOKIE_REFRESH: 336h
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: .myalabor.ch
      OAUTH2_PROXY_COOKIE_DOMAINS: .myalabor.ch
      OAUTH2_PROXY_REDIRECT_URL: https://${HOST_DASHBOARD:-dashboard.myalabor.ch}/oauth2/callback
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/api/health"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
    ports:
      - "127.0.0.1:4180:4180"

  oauth2-proxy-einkauf:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    restart: unless-stopped
    depends_on:
      - pocket-id
    profiles: ["apps"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4181
      OAUTH2_PROXY_UPSTREAMS: ${UPSTREAM_EINKAUF:-http://host.docker.internal:8791}
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER:-https://auth.myalabor.ch}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OIDC_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 2160h
      OAUTH2_PROXY_COOKIE_REFRESH: 336h
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: .myalabor.ch
      OAUTH2_PROXY_COOKIE_DOMAINS: .myalabor.ch
      OAUTH2_PROXY_REDIRECT_URL: https://${HOST_EINKAUF:-einkaufen.myalabor.ch}/oauth2/callback
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
    ports:
      - "127.0.0.1:4181:4181"
