## Expanded at start from oauth2-proxy-dashboard.env
provider = "oidc"
oidc_issuer_url = "https://auth.myalabor.ch"
client_id = "${OIDC_CLIENT_ID}"
client_secret = "${OIDC_CLIENT_SECRET}"
cookie_secret = "${OIDC_COOKIE_SECRET}"

redirect_url = "https://dashboard.myalabor.ch/oauth2/callback"
upstreams = "http://127.0.0.1:8790"

http_address = "127.0.0.1:4180"
reverse_proxy = true
email_domains = ["*"]

scope = "openid email profile"
skip_provider_button = true
set_xauthrequest = true
pass_user_headers = true
pass_access_token = false

cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "2160h"
cookie_refresh = "336h"
cookie_name = "_oauth2_proxy_dash"
# Shared parent domain so later app proxies can SSO; not __Host- (needs no Domain)
cookie_domains = [".myalabor.ch"]
whitelist_domains = [".myalabor.ch"]

# Public without login (Tunnel / smoke / PWA — manifest must not trigger OIDC)
skip_auth_routes = ["^/api/health$", "^/manifest\\.webmanifest$", "^/icons/", "^/favicon"]

insecure_oidc_allow_unverified_email = true
code_challenge_method = "S256"
